name: Reproducible data pipeline

"on":
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "contracts/**"
      - "sql/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/**"
      - "docker-compose.yml"
      - "data/public/**"
  pull_request:
    paths:
      - "src/**"
      - "config/**"
      - "contracts/**"
      - "sql/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/**"
      - "docker-compose.yml"
      - "data/public/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fleet_fuel_ci
          POSTGRES_USER: fleet_test
          # Ephemeral CI-only service on loopback; no production credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U fleet_test -d fleet_fuel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FUEL_POSTGRES_DSN: postgresql://fleet_test@127.0.0.1:5432/fleet_fuel_ci
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned runtime and test dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Test calculations, ingestion and real PostgreSQL transactions
        run: python -m pytest -q --junitxml=validation/ci-tests.xml
      - name: Rebuild all 1800 trips through PostgreSQL and HTTP sources
        run: python -m fleet_fuel.cli run --profile full --operational postgres --skip-report
      - name: Preserve full-project verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-full-evidence
          path: |
            validation/ci-tests.xml
            validation/postgres_bootstrap.json
            validation/postgres_extract.json
            validation/ingestion_report.json
            validation/build_report.json
            validation/run_manifest.json
            validation/quality_report.json
            data/generation_manifest.json
            data/normalized/manifest.json
            outputs/analytics_summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve PostgreSQL-built full database and source extract
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-full-database
          path: |
            data/DA-E01.duckdb
            data/postgres_extract/**/*.jsonl
            validation/postgres_bootstrap.json
            validation/postgres_extract.json
            validation/build_report.json
            validation/run_manifest.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
