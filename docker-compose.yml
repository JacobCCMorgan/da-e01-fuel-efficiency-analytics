services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${FUEL_POSTGRES_DATABASE:-fleet_fuel}
      POSTGRES_USER: ${FUEL_POSTGRES_USER:-fleet_user}
      POSTGRES_PASSWORD: ${FUEL_POSTGRES_PASSWORD:?Set FUEL_POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:${FUEL_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - fleet_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  fleet_postgres:
